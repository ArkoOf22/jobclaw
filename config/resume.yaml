resume:
  master_path: "data/resume/master_resume.txt"
  output_format: "txt"

  generation:
    preserve_facts: true
    allow_rewording: true
    allow_reordering: true
    allow_skill_selection: true
    allow_metric_changes: false
    allow_experience_invention: false

  llm:
    provider: "openrouter"

    # Pinned deliberately. "openrouter/auto" delegates provider choice to
    # OpenRouter, which means the candidate's full resume could be sent to any
    # provider in the pool, including ones that train on inputs. Resume prompts
    # carry employment history, education, and contact details, so the
    # destination must be predictable.
    # Resume tailoring: prose a recruiter reads, so quality matters. Gemini
    # 2.5 Flash is roughly 8x cheaper than claude-sonnet-4.5 ($0.30/$2.50 vs
    # $3/$15 per million) and is available on ZDR endpoints, so the privacy
    # constraints below still hold.
    model: "google/gemini-2.5-flash"

    # Questionnaire answers: short factual strings like "Yes" or "India".
    # Paying resume rates for those is waste. Also ZDR-available.
    answers_model: "mistralai/mistral-small-24b-instruct-2501"

    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

    # Enforced per request, not just as an account default, so the guarantee
    # travels with the code. If no provider satisfies these constraints the
    # request fails loudly rather than quietly routing to one that retains data.
    privacy:
      deny_data_collection: true
      require_zero_data_retention: true
