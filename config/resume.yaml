resume:
  master_path: "data/resume/master_resume.txt"
  output_format: "txt"

  generation:
    preserve_facts: true
    allow_rewording: true
    allow_reordering: true
    allow_skill_selection: true
    allow_metric_changes: false
    allow_experience_invention: false

  llm:
    # "google" calls Google's Generative Language API (AI Studio "Gemini API")
    # directly. "openrouter" routes through OpenRouter instead; both are wired
    # in cmd/jobclaw newLLMClient and satisfy the same interface, so this is a
    # pure config switch.
    provider: "google"

    # Bare Gemini model IDs. Google's API wants "gemini-flash-latest", NOT the
    # "google/..." form OpenRouter uses.
    #
    # These are the stable "latest" ALIASES rather than pinned versions, on
    # purpose. A pinned version rots: this config originally named
    # "gemini-2.5-flash", which Google's API now answers with a 404 and a
    # deprecation notice ("no longer available to new users") for keys that
    # don't already have access. The aliases always resolve to the current
    # Flash tier, so the config does not break when a specific version is
    # retired. Both were verified live against this key returning HTTP 200.
    #
    # Resume tailoring is prose a recruiter reads, so it uses full Flash.
    model: "gemini-flash-latest"

    # Questionnaire answers are short factual strings like "Yes" or "India", so
    # they use the cheaper Flash-Lite alias. Google cannot serve the Mistral
    # model this used to name, so it had to change with the provider.
    answers_model: "gemini-flash-lite-latest"

    # Default is Google's v1beta Generative Language endpoint when empty. Set
    # here for clarity; the google client falls back to the same value.
    base_url: "https://generativelanguage.googleapis.com/v1beta"

    # AI Studio key, "AIza...". The variable *name* is what matters here; the
    # value lives in the environment.
    api_key_env: "GEMINI_API_KEY"

    # PRIVACY — READ BEFORE CHANGING THE PROVIDER.
    #
    # Under provider "openrouter" these are enforced per request: OpenRouter
    # restricts routing to data_collection="deny" and zdr=true endpoints and
    # fails loudly when none qualifies.
    #
    # Under provider "google" they are NOT sent on the wire, because Google's
    # API has no per-request equivalent. The guarantee becomes an operational
    # precondition instead: the GEMINI_API_KEY above MUST be a PAID-TIER key.
    # Google does not train on paid-tier prompts; free-tier keys are used for
    # product improvement and would violate deny_data_collection. Resume and
    # questionnaire prompts carry the candidate's full history and contact
    # details, so a free-tier key here is not acceptable. See the google
    # package doc comment for the full rationale.
    privacy:
      deny_data_collection: true
      require_zero_data_retention: true
