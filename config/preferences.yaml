job_preferences:

  company_type:
    primary: "product"

    preferred:
      - "Product Company"
      - "Technology Product Company"
      - "Fintech Product"
      - "SaaS Product"
      - "Consumer Internet Product"
      - "Developer Tools"
      - "AI Product"
      - "Cloud Infrastructure Product"
      - "Marketplace Product"
      - "E-commerce Product"

    excluded:
      - "IT Services"
      - "IT Consulting"
      - "Technology Consulting"
      - "Outsourcing"
      - "Staff Augmentation"
      - "Body Shopping"

    require_product_company: true

  roles:
    preferred:
      - "Software Development Engineer"
      - "Backend Engineer"
      - "SDE I"
      - "SDE II"

    acceptable:
      - "Software Engineer"
      - "Platform Engineer"
      - "Distributed Systems Engineer"

    # Matched against the job title. Any hit forces a SKIP regardless of score.
    excluded:
      - "Frontend Engineer"
      - "UI Engineer"
      - "QA Engineer"
      - "Manual Tester"
      - "Data Analyst"
      # Entry-level and non-permanent roles. A Stripe "Software Engineer, Intern"
      # scored 67.8 and was shortlisted, because scoring rewards the company and
      # the stack without understanding seniority.
      - "Intern"
      - "Internship"
      - "Trainee"
      - "Apprentice"
      - "Graduate Programme"
      - "Co-op"
      # Genuinely unreachable seniority for a 2-year candidate. These titles
      # mean 8+ years or people-management, not a stretch, so they stay hard
      # vetoes. "Senior"/"Sr"/"Lead" are NOT here any more — they moved to
      # `demoted` below, because in India those often mean 3-4 years and the
      # candidate can legitimately apply. See that list to tune.
      - "Staff Engineer"
      - "Staff"
      - "Senior Staff"
      - "Principal Engineer"
      - "Principal"
      - "Engineering Manager"
      - "Director"
      - "Head of"
      - "Vice President"
      - "Support Engineer"
      - "Implementation Engineer"
      - "Technical Support Engineer"
      # Women/diversity-specific programmes.
      - "Women"
      - "Female"
      - "She"
      - "Her"
      - "Returnship"
      - "Women in Tech"

    # Demoted titles are NOT vetoed — they stay visible but take a ranking
    # penalty (seniorityDemotionPenalty in the scorer, currently 12 points). In
    # India "Senior"/"Sr"/"Lead" backend roles often want 3-4 years, which a
    # strong 2-year candidate can legitimately apply to, so the system shows
    # them ranked below equivalent non-senior roles rather than hiding them.
    # A genuinely strong senior match can still clear the shortlist threshold.
    # Move any of these into `excluded` above to hard-veto it again.
    demoted:
      - "Senior"
      - "Sr"
      - "Lead"

  locations:
    preferred:
      - "Bangalore"
      - "Bengaluru"

    acceptable:
      - "Remote"
      - "Hyderabad"
      - "Pune"
      - "Mumbai"
      - "Gurgaon"
      - "Delhi NCR"

  work_mode:
    preferred:
      - "Hybrid"
      - "Onsite"
      - "Remote"

  compensation:
    currency: "INR"
    target_min_lpa: 21
    target_max_lpa: 23

  domains:
    strongly_preferred:
      - "Fintech"
      - "Payments"
      - "Banking Technology"
      - "Consumer Internet"
      - "SaaS"
      - "E-commerce"
      - "Developer Tools"
      - "AI Infrastructure"
      - "Cloud Infrastructure"
      - "Distributed Systems"

    preferred:
      - "Marketplace"
      - "Logistics Technology"
      - "Gaming"
      - "Cybersecurity"

  technology_preferences:
    strongly_preferred:
      - "Go"
      - "Golang"
      - "Distributed Systems"
      - "Kafka"
      - "Microservices"
      - "Backend"
      - "PostgreSQL"
      - "Redis"
      - "Concurrency"
      - "Idempotency"

    preferred:
      - "Java"
      - "Spring Boot"
      - "gRPC"
      - "AWS"
      - "Kubernetes"
      - "Docker"
      - "Prometheus"
      - "Grafana"

  experience:
    # max_required_years is the comfortable target, not a veto any more. A
    # posting at or below it earns full experience marks; above it the graded
    # experience score drops (candidate+1yr → 10, +2yr → 5, beyond → 0) so the
    # role ranks lower but stays visible. Kept at the candidate's 2 years.
    #
    # A range counts by its low end, so "2-4 years" scores as 2.
    max_required_years: 2

    # hard_ceiling_years is the real reach limit: a posting demanding MORE than
    # this is vetoed to SKIP. Set to 5 so "3-5 years" roles stay visible with a
    # low experience score (the honest signal — you see the gap in the stored
    # reasoning), while "8+ years" postings, which are a different candidate's
    # job, are removed. Raise to see more senior roles; lower to tighten.
    # Unset falls back to 5 in the scorer, so the veto never disables itself.
    hard_ceiling_years: 5

  job_quality:
    # Lowered from 70 → 65 → 60: a fresh-start 24h sweep produced only 4 matches at 65,
    # while genuine near-misses (AiPrise, Nokia, HireQuotient, Blue Yonder) clustered
    # in the low 60s. Noise lives in the 20s-40s, so 60 widens without admitting trash.
    minimum_score_for_shortlist: 60
    minimum_score_for_apply: 80
    minimum_score_for_autopilot: 90

  application_policy:
    max_applications_per_day: 10
    require_human_approval: true
    allow_autonomous_submission: false

  exclusions:
    internships: true
    unpaid_roles: true
    roles_without_clear_job_description: true
    service_based_companies: true
