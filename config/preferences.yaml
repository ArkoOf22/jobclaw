job_preferences:

  company_type:
    primary: "product"

    preferred:
      - "Product Company"
      - "Technology Product Company"
      - "Fintech Product"
      - "SaaS Product"
      - "Consumer Internet Product"
      - "Developer Tools"
      - "AI Product"
      - "Cloud Infrastructure Product"
      - "Marketplace Product"
      - "E-commerce Product"

    excluded:
      - "IT Services"
      - "IT Consulting"
      - "Technology Consulting"
      - "Outsourcing"
      - "Staff Augmentation"
      - "Body Shopping"

    require_product_company: true

  roles:
    preferred:
      - "Software Development Engineer"
      - "Backend Engineer"
      - "SDE I"
      - "SDE II"

    acceptable:
      - "Software Engineer"
      - "Platform Engineer"
      - "Distributed Systems Engineer"

    # Matched against the job title. Any hit forces a SKIP regardless of score.
    excluded:
      - "Frontend Engineer"
      - "UI Engineer"
      - "QA Engineer"
      - "Manual Tester"
      - "Data Analyst"
      # Entry-level and non-permanent roles. A Stripe "Software Engineer, Intern"
      # scored 67.8 and was shortlisted, because scoring rewards the company and
      # the stack without understanding seniority.
      - "Intern"
      - "Internship"
      - "Trainee"
      - "Apprentice"
      - "Graduate Programme"
      - "Co-op"
      # Seniority a 2-year candidate cannot reach.
      #
      # "Senior"/"Sr"/"Lead" are back here after being tried on the `demoted`
      # list. The theory was that in India those often mean 3-4 years, so they
      # should rank low rather than vanish. Measured against a real shortlist it
      # did not work: 28 senior-titled roles stayed visible, none of them
      # applicable, and the candidate spent the time filtering them by hand.
      #
      # Level markers matter as much as the words. "Software Engineer III" and
      # "SDE 3" are 5-8 year roles that almost never print a year figure, so the
      # experience veto is blind to them — 63 of them were reaching the
      # shortlist. Roman numerals are listed bare because "iii" cannot collide
      # with anything; digits are listed as two-word phrases because title
      # matching is word-based and a bare "3" would also veto
      # "Java Developer 2-3 Yrs", which is a job worth seeing.
      #
      # Note "II" is deliberately absent: "SDE II" and "Software Engineer II"
      # are target roles.
      - "Senior"
      - "Sr"
      - "Lead"
      - "III"
      - "IV"
      - "Engineer 3"
      - "Engineer 4"
      - "Engineer 5"
      - "Developer 3"
      - "Developer 4"
      - "Developer 5"
      - "SDE 3"
      - "SDE 4"
      - "Level 5"
      - "Level 6"
      # Bare "Manager" because "Engineering Manager" above does not catch
      # "Manager of Software Engineering". No individual-contributor title
      # contains the word, so this is safe as a whole-word match.
      - "Manager"
      # Architect roles are senior by definition. SDET is test automation
      # rather than backend — "QA Engineer" and "Manual Tester" are already
      # excluded, and this closes the same gap.
      - "Architect"
      - "SDET"
      - "Staff Engineer"
      - "Staff"
      - "Senior Staff"
      - "Principal Engineer"
      - "Principal"
      - "Engineering Manager"
      - "Director"
      - "Head of"
      - "Vice President"
      - "Support Engineer"
      - "Implementation Engineer"
      - "Technical Support Engineer"
      # Women/diversity-specific programmes.
      - "Women"
      - "Female"
      - "She"
      - "Her"
      - "Returnship"
      - "Women in Tech"

    # Demoted titles are NOT vetoed — they stay visible but take a ranking
    # penalty (seniorityDemotionPenalty in the scorer, currently 12 points).
    #
    # Deliberately empty. "Senior"/"Sr"/"Lead" lived here and it did not work:
    # a ranking penalty still leaves the role on the list, and a list the
    # candidate has to filter by hand is the problem the scorer exists to solve.
    # They are hard vetoes again, in `excluded` above.
    #
    # The mechanism is kept for a title that is genuinely worth seeing ranked
    # lower rather than hidden. Nothing currently qualifies. If the shortlist
    # ever runs dry, moving "Senior" here is the first thing to try, because it
    # widens the list without silently admitting 8-year roles.
    demoted: []

  locations:
    preferred:
      - "Bangalore"
      - "Bengaluru"

    acceptable:
      - "Remote"
      - "Hyderabad"
      - "Pune"
      - "Mumbai"
      - "Gurgaon"
      - "Delhi NCR"

  work_mode:
    preferred:
      - "Hybrid"
      - "Onsite"
      - "Remote"

  compensation:
    currency: "INR"
    target_min_lpa: 21
    target_max_lpa: 23

  domains:
    strongly_preferred:
      - "Fintech"
      - "Payments"
      - "Banking Technology"
      - "Consumer Internet"
      - "SaaS"
      - "E-commerce"
      - "Developer Tools"
      - "AI Infrastructure"
      - "Cloud Infrastructure"
      - "Distributed Systems"

    preferred:
      - "Marketplace"
      - "Logistics Technology"
      - "Gaming"
      - "Cybersecurity"

  technology_preferences:
    strongly_preferred:
      - "Go"
      - "Golang"
      - "Distributed Systems"
      - "Kafka"
      - "Microservices"
      - "Backend"
      - "PostgreSQL"
      - "Redis"
      - "Concurrency"
      - "Idempotency"

    preferred:
      - "Java"
      - "Spring Boot"
      - "gRPC"
      - "AWS"
      - "Kubernetes"
      - "Docker"
      - "Prometheus"
      - "Grafana"

  experience:
    # max_required_years is the comfortable target, not a veto any more. A
    # posting at or below it earns full experience marks; above it the graded
    # experience score drops (candidate+1yr → 10, +2yr → 5, beyond → 0) so the
    # role ranks lower but stays visible. Kept at the candidate's 2 years.
    #
    # A range counts by its low end, so "2-4 years" scores as 2.
    max_required_years: 2

    # hard_ceiling_years is the veto line: a posting stating MORE than this is
    # forced to SKIP whatever else it scores.
    #
    # Set to 2, the candidate's actual experience. This was briefly 5, on the
    # reasoning that a "3-5 years" posting is worth seeing and the gap could be
    # expressed as a lower score rather than by hiding the role. In practice that
    # failed: the shortlist filled with 3-5, 5-6 and 3-8 year roles, and the
    # candidate ended up doing the filtering by hand, opening links for jobs he
    # could not apply to. A filter that defers the decision to the reader is not
    # a filter.
    #
    # Note ranges count by their LOW end, so this is less strict than it looks:
    # "2-4 years" reads as 2 and survives, because that posting is genuinely
    # open to a two-year candidate. "3-5 years" reads as 3 and is vetoed.
    #
    # Raise this only if the shortlist runs dry. Unset falls back to the
    # candidate's own total_years, so an absent key tightens rather than
    # disables the veto.
    hard_ceiling_years: 2

  job_quality:
    # Lowered from 70 → 65 → 60: a fresh-start 24h sweep produced only 4 matches at 65,
    # while genuine near-misses (AiPrise, Nokia, HireQuotient, Blue Yonder) clustered
    # in the low 60s. Noise lives in the 20s-40s, so 60 widens without admitting trash.
    minimum_score_for_shortlist: 60
    minimum_score_for_apply: 80
    minimum_score_for_autopilot: 90

  application_policy:
    max_applications_per_day: 10
    require_human_approval: true
    allow_autonomous_submission: false

  exclusions:
    internships: true
    unpaid_roles: true
    roles_without_clear_job_description: true
    service_based_companies: true
