# Drop-in override for the packaged alloy.service.
#
# Install as /etc/systemd/system/alloy.service.d/override.conf so package
# upgrades cannot clobber it:
#
#   sudo mkdir -p /etc/systemd/system/alloy.service.d
#   sudo cp deploy/alloy/alloy-override.conf \
#          /etc/systemd/system/alloy.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart alloy

[Service]
# Grafana Cloud credentials, read by sys.env() in config.alloy. Root-only,
# untracked, and created by hand from the Grafana Cloud stack details:
#
#   GRAFANA_CLOUD_PROM_URL=https://prometheus-prod-XX-....grafana.net/api/prom/push
#   GRAFANA_CLOUD_PROM_USER=<numeric instance id>
#   GRAFANA_CLOUD_PROM_TOKEN=<api token with metrics push scope>
#
#   sudo chmod 600 /etc/alloy/grafana-cloud.env
#   sudo chown root:root /etc/alloy/grafana-cloud.env
#
# No leading `-`: if the credentials are missing, failing loudly is correct.
# Starting without them would push nothing and look healthy.
EnvironmentFile=/etc/alloy/grafana-cloud.env

# This host is a 2GB t3.small with a history of OOM kills, and monitoring that
# contributes to the next one is worse than no monitoring. Alloy's steady state
# here is a handful of series from two scrape targets; these bounds are generous
# for that while making Alloy an early reclaim candidate rather than a cause.
#
# MemoryHigh throttles and reclaims before MemoryMax kills, so a slow leak shows
# up as Alloy getting slow, which is visible on the dashboard, instead of a
# silent restart loop.
MemoryHigh=128M
MemoryMax=256M

# A monitoring agent should never be what a scheduler prefers over the workload
# it is monitoring.
Nice=10
CPUWeight=50
IOWeight=50
